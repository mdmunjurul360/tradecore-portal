version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: tradecore_db
    environment:
      POSTGRES_USER: tradecore
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tradecore
    ports:
      - "5432:5432"
    volumes:
      - tradecore_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradecore_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  tradecore_pgdata:
