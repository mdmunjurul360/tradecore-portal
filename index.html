<!doctype html>
<html lang="en" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TradeCore | Personal Area & Trading Portal</title>
    <meta name="description" content="Professional Forex & CFD Trading Client Portal with comprehensive account management, funding, copy trading, performance analytics, and multi-asset wallet." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Anti-flash theme script: runs synchronously before paint to prevent FOUC -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tradecore_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark =
            saved === 'dark' ||
            (saved === 'system' && prefersDark) ||
            (!saved); // default to dark
          if (shouldBeDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-amber-500/20 selection:text-amber-500 overflow-x-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
